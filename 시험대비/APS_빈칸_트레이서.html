<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>APS 빈칸 트레이서</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#E9EDF2; --surface:#FFFFFF; --surface2:#F3F5F8; --ink:#141C26; --muted:#5F6B7A; --line:#D3DAE3;
  --accent:#2B62B8; --accent-ink:#FFFFFF; --accent-soft:#E3ECFA;
  --read:#FFD84D; --read-ink:#3A2E00; --write:#2B62B8; --write-ink:#FFFFFF;
  --ok:#1F8A5B; --ok-soft:#E1F4EA; --bad:#C43D3D; --bad-soft:#FBE6E6; --warn:#B8600A; --warn-soft:#FDEEDC;
  --kw:#8B3CC7; --str:#1F8A5B; --num:#B8600A; --fn:#2B62B8; --cmt:#8792A0;
  --cur:#EAF1FD; --cur-bar:#2B62B8; --changed:#FFF3C4;
  --shadow:0 1px 2px rgba(20,28,38,.06),0 8px 24px -12px rgba(20,28,38,.18);
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono","D2Coding",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1319; --surface:#161D26; --surface2:#1D2631; --ink:#E6EBF1; --muted:#8C98A7; --line:#2A3542;
  --accent:#7AA9F0; --accent-ink:#0B1626; --accent-soft:#1D3357;
  --read:#E2BE3A; --read-ink:#1F1800; --write:#4F85DC; --write-ink:#FFFFFF;
  --ok:#4CC08A; --ok-soft:#153426; --bad:#F07373; --bad-soft:#3D1A1A; --warn:#E8A256; --warn-soft:#3A2A14;
  --kw:#C99AF0; --str:#5FCB93; --num:#E8A256; --fn:#7AA9F0; --cmt:#66727F;
  --cur:#1B2A44; --cur-bar:#7AA9F0; --changed:#3A3418;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#0E1319; --surface:#161D26; --surface2:#1D2631; --ink:#E6EBF1; --muted:#8C98A7; --line:#2A3542;
  --accent:#7AA9F0; --accent-ink:#0B1626; --accent-soft:#1D3357;
  --read:#E2BE3A; --read-ink:#1F1800; --write:#4F85DC; --write-ink:#FFFFFF;
  --ok:#4CC08A; --ok-soft:#153426; --bad:#F07373; --bad-soft:#3D1A1A; --warn:#E8A256; --warn-soft:#3A2A14;
  --kw:#C99AF0; --str:#5FCB93; --num:#E8A256; --fn:#7AA9F0; --cmt:#66727F;
  --cur:#1B2A44; --cur-bar:#7AA9F0; --changed:#3A3418;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;padding-block:0 32px;padding-inline:16px;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1480px;margin:0 auto}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px 16px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:38px;height:38px;border-radius:9px;background:var(--accent);display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:6px}
.mark i{display:block;background:var(--accent-ink);opacity:.35;border-radius:2px}
.mark i:nth-child(5){opacity:1;background:var(--read)}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.progress{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.progress .bar{width:140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress .bar b{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.progress strong{color:var(--ink);font-variant-numeric:tabular-nums}

/* layout */
.app{display:grid;grid-template-columns:262px minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1180px){.app{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} .plist{grid-column:1/-1;display:flex;overflow-x:auto;gap:6px;padding-bottom:4px} .plist .pitem{flex:0 0 auto;min-width:160px}}
@media (max-width:820px){.app{grid-template-columns:minmax(0,1fr)}}

/* problem list */
.plist{display:flex;flex-direction:column;gap:4px}
.plist .grp{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
.pitem{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 10px;color:var(--ink)}
.pitem:hover{background:var(--surface)}
.pitem.on{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.pitem .n{font-family:var(--mono);font-size:11px;color:var(--muted);width:20px;font-variant-numeric:tabular-nums}
.pitem .t{flex:1;font-weight:500;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .dots{display:flex;gap:2px}
.pitem .dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.pitem .dots i.f{background:var(--muted)}
.pitem .done{width:16px;height:16px;border-radius:50%;background:var(--ok);color:#fff;font-size:10px;display:none;align-items:center;justify-content:center;flex:none}
.pitem.solved .done{display:flex}
.pitem.solved .dots{display:none}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.work{display:flex;flex-direction:column;gap:14px;min-width:0}
.viz{display:flex;flex-direction:column;gap:14px;min-width:0;position:sticky;top:12px}
@media (max-width:820px){.viz{position:static}}
.phead{padding:18px 20px 16px}
.eyebrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.tag{background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:11.5px;color:var(--muted)}
.tag.lv{border-color:transparent;background:var(--accent-soft);color:var(--accent);font-weight:600}
.phead h2{margin:0 0 8px;font-size:19px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.phead .desc{margin:0;color:var(--ink);max-width:62ch}
.phead .desc code{font-family:var(--mono);font-size:12.5px;background:var(--surface2);padding:1px 5px;border-radius:4px}

/* code */
.codecard{overflow:hidden}
.codebar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface2);flex-wrap:wrap}
.codebar .fname{font-family:var(--mono);font-size:12px;color:var(--muted);margin-right:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.code{font-family:var(--mono);font-size:13.5px;line-height:1.9;padding:12px 0;overflow-x:auto;tab-size:4}
.ln{display:flex;min-width:max-content;padding-right:20px;border-left:3px solid transparent}
.ln .no{width:44px;flex:none;text-align:right;padding-right:14px;color:var(--cmt);user-select:none;font-size:12px}
.ln .src{white-space:pre}
.ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
.ln.err{background:var(--bad-soft);border-left-color:var(--bad)}
.kw{color:var(--kw);font-weight:500}.st{color:var(--str)}.nu{color:var(--num)}.fn{color:var(--fn)}.cm{color:var(--cmt);font-style:italic}
.blank{font-family:var(--mono);font-size:13px;border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--ink);border-radius:5px;padding:1px 6px;margin:0 1px;min-width:3.5ch;height:26px;vertical-align:middle;line-height:1}
.blank::placeholder{color:var(--accent);opacity:.75}
.blank:focus{outline:none;border-style:solid;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.blank.ok{border-color:var(--ok);background:var(--ok-soft);border-style:solid}
.blank.ng{border-color:var(--bad);background:var(--bad-soft);border-style:solid}
textarea.free{width:100%;min-height:300px;resize:vertical;border:0;background:transparent;font-family:var(--mono);font-size:13.5px;line-height:1.7;padding:12px 16px;outline:none;tab-size:4;white-space:pre}
.stdin{border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:flex-start;background:var(--surface2)}
.stdin label{font-size:12px;color:var(--muted);padding-top:6px;white-space:nowrap}
.stdin textarea{flex:1;min-height:52px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--mono);font-size:12.5px;padding:6px 8px;resize:vertical}

/* result banner */
.result{display:none;padding:12px 16px;border-radius:10px;border:1px solid var(--line);gap:12px;align-items:flex-start}
.result.show{display:flex}
.result .ic{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:14px}
.result.pass{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 40%,transparent)} .result.pass .ic{background:var(--ok);color:#fff}
.result.fail{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,transparent)} .result.fail .ic{background:var(--bad);color:#fff}
.result.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,transparent)} .result.warn .ic{background:var(--warn);color:#fff}
.result h3{margin:0 0 2px;font-size:14px}
.result p{margin:0;font-size:13px;color:var(--ink)}
.result pre{margin:6px 0 0;font-family:var(--mono);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;white-space:pre-wrap;max-height:160px;overflow:auto}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.cmp small{display:block;font-size:11px;color:var(--muted);margin-bottom:3px;font-weight:600}
@media (max-width:520px){.cmp{grid-template-columns:1fr}}
.hints{display:none;padding:12px 16px;font-size:13px;background:var(--surface2);border-top:1px solid var(--line)}
.hints.show{display:block}
.hints ol{margin:4px 0 0;padding-left:20px}.hints li{margin:2px 0}.hints li b{font-family:var(--mono);color:var(--accent);font-weight:600}

/* viz */
.vhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.vhead h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.02em}
.vhead .state{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.controls{display:flex;align-items:center;gap:6px;padding:12px 16px;flex-wrap:wrap}
.controls .ib{width:34px;height:32px;padding:0;justify-content:center;font-size:14px}
.controls .ib.play{width:44px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.controls input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.controls .spd{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.controls .spd input{width:80px}
.stepinfo{display:flex;justify-content:space-between;align-items:center;padding:0 16px 10px;font-size:12.5px;color:var(--muted);gap:10px}
.stepinfo b{color:var(--ink);font-variant-numeric:tabular-nums}
.stepinfo .st{font-family:var(--mono);font-size:12px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.legend{display:flex;gap:14px;padding:0 16px 12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line)}
.legend .lr{background:var(--read)}.legend .lw{background:var(--write)}.legend .lc{background:var(--changed)}
.vars{padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px;min-height:120px}
.vars .empty{color:var(--muted);font-size:13px;padding:24px 0;text-align:center}
.frame-title{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.scalars{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:7px;overflow:hidden;font-family:var(--mono);font-size:12.5px;background:var(--surface)}
.chip .k{padding:3px 8px;background:var(--surface2);color:var(--muted);border-right:1px solid var(--line)}
.chip .v{padding:3px 9px;font-variant-numeric:tabular-nums;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.chg{border-color:var(--num)}.chip.chg .v{background:var(--changed)}
.arr{display:flex;flex-direction:column;gap:4px}
.arr .name{font-family:var(--mono);font-size:12.5px;display:flex;gap:8px;align-items:baseline}
.arr .name em{font-style:normal;color:var(--muted);font-size:11px}
.cells{display:flex;flex-wrap:wrap;gap:3px;align-items:flex-end}
.cell{display:flex;flex-direction:column;align-items:center;min-width:34px}
.cell .ix{font-family:var(--mono);font-size:10px;color:var(--muted);line-height:1.3}
.cell .bx{border:1px solid var(--line);background:var(--surface2);border-radius:4px;min-width:34px;padding:3px 6px;text-align:center;font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;transition:background .15s}
.cell.rd .bx{background:var(--read);color:var(--read-ink);border-color:var(--read)}
.cell.wr .bx{background:var(--write);color:var(--write-ink);border-color:var(--write);font-weight:600}
.cell.chg .bx{box-shadow:inset 0 -3px 0 var(--num)}
.grid2{display:inline-grid;gap:3px;font-family:var(--mono);font-size:12.5px}
.grid2 .hd{font-size:10px;color:var(--muted);text-align:center;align-self:end;padding-bottom:1px}
.grid2 .rh{font-size:10px;color:var(--muted);align-self:center;text-align:right;padding-right:4px}
.grid2 .bx{border:1px solid var(--line);background:var(--surface2);border-radius:4px;min-width:34px;padding:3px 6px;text-align:center;font-variant-numeric:tabular-nums}
.grid2 .bx.row{background:color-mix(in srgb,var(--read) 35%,var(--surface2))}
.grid2 .bx.rd{background:var(--read);color:var(--read-ink);border-color:var(--read)}
.grid2 .bx.wr{background:var(--write);color:var(--write-ink);border-color:var(--write);font-weight:600}
.grid2 .bx.chg{box-shadow:inset 0 -3px 0 var(--num)}
.out{padding:0 0 4px}
.out pre{margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.6;padding:12px 16px;min-height:64px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.out pre .er{color:var(--bad);font-weight:600}
.out pre .cursor{display:inline-block;width:7px;height:13px;background:var(--accent);vertical-align:-2px;margin-left:1px;opacity:.7}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface2);color:var(--muted)}
.foot{color:var(--muted);font-size:12px;text-align:center;padding-top:22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <div>
        <h1>APS 빈칸 트레이서</h1>
        <p>배열 · 반복문 · 완전탐색 — 빈칸을 채우고, 코드가 배열 위를 어떻게 훑는지 한 단계씩 따라가 보세요</p>
      </div>
    </div>
    <div class="progress"><span>해결한 문제</span><div class="bar"><b id="pbar"></b></div><strong id="ptext">0 / 0</strong></div>
  </header>

  <div class="app">
    <nav class="plist" id="plist" aria-label="문제 목록"></nav>

    <section class="work">
      <div class="card phead" id="phead"></div>
      <div class="card codecard">
        <div class="codebar">
          <span class="fname" id="fname">main.py</span>
          <button class="btn sm" id="btnHint" type="button">힌트</button>
          <button class="btn sm" id="btnAnswer" type="button">정답 보기</button>
          <button class="btn sm" id="btnReset" type="button">초기화</button>
          <button class="btn pri" id="btnRun" type="button">▶ 실행 &amp; 추적</button>
        </div>
        <div id="codeArea"></div>
        <div class="hints" id="hints"></div>
      </div>
      <div class="result" id="result"></div>
    </section>

    <section class="viz">
      <div class="card">
        <div class="vhead"><h3>실행 추적</h3><span class="state" id="vstate">실행 전</span></div>
        <div class="controls">
          <button class="btn ib" id="bFirst" type="button" title="처음으로">⏮</button>
          <button class="btn ib" id="bPrev" type="button" title="이전 단계">◀</button>
          <button class="btn ib play" id="bPlay" type="button" title="재생 / 일시정지">▶</button>
          <button class="btn ib" id="bNext" type="button" title="다음 단계">▶|</button>
          <button class="btn ib" id="bLast" type="button" title="끝으로">⏭</button>
          <input type="range" id="slider" min="0" max="0" value="0" aria-label="실행 단계">
          <label class="spd">속도 <input type="range" id="speed" min="1" max="10" value="5" aria-label="재생 속도"></label>
        </div>
        <div class="stepinfo"><span>단계 <b id="stepNo">0</b> / <b id="stepMax">0</b></span><span class="st" id="stepLine">—</span></div>
        <div class="legend"><span><i class="lr"></i>읽은 칸</span><span><i class="lw"></i>바꾼 칸</span><span><i class="lc"></i>값이 바뀐 변수</span></div>
        <div class="vars" id="vars"><div class="empty">▶ 실행 &amp; 추적 버튼을 누르면 변수와 배열이 여기에 나타납니다</div></div>
      </div>
      <div class="card out">
        <div class="vhead"><h3>출력</h3><span class="state" id="ostate"></span></div>
        <pre id="output"></pre>
      </div>
      <p class="foot">빈칸에서 <span class="kbd">Enter</span> 실행 · 추적 중 <span class="kbd">←</span> <span class="kbd">→</span> 단계 이동 · <span class="kbd">Space</span> 재생</p>
    </section>
  </div>
</div>

<script>
/* ===== 미니 Python 인터프리터 (배열·반복문·조건문 수준) ===== */
class PyError extends Error { constructor(msg, line) { super(msg); this.line = line; } }
class PFloat { constructor(v) { this.v = v; } }
class PTuple { constructor(items) { this.items = items; } }
class PDict { constructor() { this.m = new Map(); } }
class PFunc { constructor(name, params, body) { this.name = name; this.params = params; this.body = body; } }
class PBuiltin { constructor(name, fn) { this.name = name; this.fn = fn; } }
class Env {
  constructor(parent) { this.vars = new Map(); this.parent = parent || null; }
  get(n) { if (this.vars.has(n)) return this.vars.get(n); return this.parent ? this.parent.get(n) : undefined; }
  has(n) { return this.vars.has(n) || (this.parent ? this.parent.has(n) : false); }
  set(n, v) { this.vars.set(n, v); }
}

const KEYWORDS = new Set(['if', 'elif', 'else', 'for', 'while', 'in', 'not', 'and', 'or', 'def', 'return', 'break', 'continue', 'pass', 'True', 'False', 'None', 'is', 'global']);
const OPS3 = ['**=', '//=', '<<=', '>>='];
const OPS2 = ['**', '//', '==', '!=', '<=', '>=', '+=', '-=', '*=', '/=', '%=', '&=', '|=', '^=', '<<', '>>'];
const OPS1 = '+-*/%<>=()[]{},:.&|^~';

function readString(line, i, lineno) {

const FREE = { id:'free', title:'자유 코드', lv:0, tags:['직접 작성'], desc:'원하는 코드를 직접 적고 추적해 보세요. <code>input()</code>을 쓰면 아래 입력 칸의 내용을 한 줄씩 읽습니다. 지원 범위: 변수, 리스트(1·2차원), 튜플, 딕셔너리, 문자열, if / for / while / def, 기본 내장 함수.',
  code:`# 예시: 배열 뒤집기

/* ===== 상태 ===== */
const $ = id => document.getElementById(id);
let cur = null, snaps = [], curOut = '', solvedGuard = false, stepIdx = 0, timer = null, freeCode = FREE.code, freeStdin = '', blankVals = {};
const MAX_STEPS = 3000;
const store = { get(k, d){ try { const v = localStorage.getItem('apst:' + k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set(k, v){ try { localStorage.setItem('apst:' + k, JSON.stringify(v)); } catch {} } };
let solved = new Set(store.get('solved', []));

/* ===== 코드 하이라이트 ===== */
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const HL = /(#.*$)|(f?"(?:[^"\\]|\\.)*"|f?'(?:[^'\\]|\\.)*')|\b(if|elif|else|for|while|in|not|and|or|def|return|break|continue|pass|True|False|None|is|global)\b|\b(print|range|len|min|max|sum|abs|int|str|list|enumerate|sorted|input|float|append|pop|sort|reversed|zip|map|split|join|bool|tuple|dict)\b|\b(\d+(?:\.\d+)?)\b/g;
function hlLine(line){
  let out = '', last = 0, m;
  HL.lastIndex = 0;
  while ((m = HL.exec(line))) {
    out += esc(line.slice(last, m.index));
    const t = esc(m[0]);
    out += m[1] ? `<span class="cm">${t}</span>` : m[2] ? `<span class="st">${t}</span>` : m[3] ? `<span class="kw">${t}</span>` : m[4] ? `<span class="fn">${t}</span>` : `<span class="nu">${t}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(line.slice(last));
}

/* ===== 문제 목록 ===== */
function renderList(){
  const el = $('plist'); el.innerHTML = '';
  const grp = document.createElement('div'); grp.className = 'grp'; grp.textContent = '연습 문제'; el.appendChild(grp);
  PROBLEMS.forEach((p, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'pitem' + (solved.has(p.id) ? ' solved' : '') + (cur && cur.id === p.id ? ' on' : '');
    b.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span><span class="t">${p.title}</span><span class="dots">${[1,2,3].map(k => `<i class="${k <= p.lv ? 'f' : ''}"></i>`).join('')}</span><span class="done">✓</span>`;
    b.addEventListener('click', () => loadProblem(p)); el.appendChild(b);
  });
  const grp2 = document.createElement('div'); grp2.className = 'grp'; grp2.textContent = '놀이터'; el.appendChild(grp2);
  const f = document.createElement('button'); f.type = 'button'; f.className = 'pitem' + (cur && cur.id === 'free' ? ' on' : '');
  f.innerHTML = `<span class="n">✎</span><span class="t">${FREE.title}</span>`; f.addEventListener('click', () => loadProblem(FREE)); el.appendChild(f);
  $('ptext').textContent = `${solved.size} / ${PROBLEMS.length}`; $('pbar').style.width = (solved.size / PROBLEMS.length * 100) + '%';
}

/* ===== 문제 로드 ===== */
function loadProblem(p){
  stopPlay(); cur = p; snaps = []; stepIdx = 0; solvedGuard = false;
  const lvName = ['', '기초', '중급', '심화'][p.lv] || '';
  $('phead').innerHTML = `<div class="eyebrow">${p.lv ? `<span class="tag lv">${lvName}</span>` : ''}${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div><h2>${p.title}</h2><p class="desc">${p.desc}</p>`;
  $('fname').textContent = p.id === 'free' ? 'playground.py' : `${p.id}.py`;
  $('btnHint').style.display = $('btnAnswer').style.display = p.id === 'free' ? 'none' : '';

}
function renderCode(){
  const area = $('codeArea');
  if (cur.id === 'free') {
    area.innerHTML = `<textarea class="free" id="freeCode" spellcheck="false" aria-label="코드"></textarea><div class="stdin"><label for="freeStdin">입력(stdin)</label><textarea id="freeStdin" placeholder="input()으로 읽을 내용을 한 줄씩" spellcheck="false"></textarea></div>`;
    const ta = $('freeCode'); ta.value = freeCode; $('freeStdin').value = freeStdin;
    ta.addEventListener('input', () => { freeCode = ta.value; store.set('free', freeCode); });
    ta.addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('    ', s, ta.selectionEnd, 'end'); freeCode = ta.value; } });

    return;
  }
  blankVals = store.get('blanks:' + cur.id, {});
  const lines = cur.code.split('\n');
  area.innerHTML = `<div class="code" id="codeLines">${lines.map((ln, i) => {
    const marked = ln.replace(/__(\d+)__/g, (_, n) => `QQBLANK${n}QQ`);
    let html = hlLine(marked).replace(/QQBLANK(\d+)QQ/g, (_, n) => `<input class="blank" id="blank-${n}" data-n="${n}" placeholder="빈칸 ${n}" spellcheck="false" autocomplete="off" autocapitalize="off" size="6">`);
    return `<div class="ln" data-line="${i + 1}"><span class="no">${i + 1}</span><span class="src">${html}</span></div>`;
  }).join('')}</div>`;
  area.querySelectorAll('.blank').forEach(inp => {
    const n = inp.dataset.n; if (blankVals[n]) inp.value = blankVals[n];
    fit(inp);
    inp.addEventListener('input', () => { solvedGuard = false; blankVals[n] = inp.value; inp.classList.remove('ok', 'ng'); fit(inp); store.set('blanks:' + cur.id, blankVals); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); run(); } });
  });
}
function fit(inp){ inp.size = Math.max(6, inp.value.length + 1); }

/* ===== 실행 ===== */
const expectedCache = {};
function answerSource(p){ return p.code.replace(/__(\d+)__/g, (_, n) => p.answers[n]); }
function expectedOf(p){ if (!(p.id in expectedCache)) { const it = new Interp({ maxSteps: 20000 }).run(answerSource(p)); expectedCache[p.id] = it.error ? null : it.out; } return expectedCache[p.id]; }
const norm = s => s.replace(/\s+/g, ' ').trim();

function run(){
  stopPlay();
  let src, stdin = '';
  if (cur.id === 'free') { src = $('freeCode').value; stdin = $('freeStdin').value; }
  else {
    const inputs = [...document.querySelectorAll('.blank')];
    const empty = inputs.find(i => i.value.trim() === '');
    if (empty) { showResult('warn', '빈칸이 비어 있어요', `빈칸 ${empty.dataset.n}을(를) 채운 뒤 실행하세요.`); empty.focus(); return; }
    inputs.forEach(i => i.classList.remove('ok', 'ng'));
    src = cur.code.replace(/__(\d+)__/g, (_, n) => blankVals[n] || '');
  }
  const it = new Interp({ stdin, maxSteps: MAX_STEPS }).run(src);
  snaps = it.steps; curOut = it.out; stepIdx = 0;
  $('slider').max = Math.max(0, snaps.length - 1);

  if (cur.id === 'free') {
    if (it.error) showResult('fail', '오류가 발생했어요', `${it.error.line ? it.error.line + '번째 줄 · ' : ''}${it.error.msg}`);
    else showResult('pass', '실행 완료', `${snaps.length - 1}단계를 거쳐 끝났습니다. 오른쪽에서 단계별로 따라가 보세요.`);
  } else {
    const exp = expectedOf(cur);
    const inputs = [...document.querySelectorAll('.blank')];
    if (it.error) {
      showResult('fail', '오류가 발생했어요', `${it.error.line ? it.error.line + '번째 줄 · ' : ''}${it.error.msg}`);
      inputs.forEach(i => { if (norm(i.value) !== norm(cur.answers[i.dataset.n])) i.classList.add('ng'); });
    } else if (exp !== null && it.out === exp) {
      inputs.forEach(i => i.classList.add('ok'));
      if (solvedGuard) showResult('pass', '정답 코드가 실행됐어요', '출력이 기대 결과와 일치합니다. 추적으로 동작을 확인한 뒤, 초기화하고 스스로 다시 채워 보세요.');
      else {
        const first = !solved.has(cur.id); solved.add(cur.id); store.set('solved', [...solved]); renderList();
        showResult('pass', first ? '정답이에요! 🎉' : '정답이에요', '출력이 기대 결과와 정확히 일치합니다. 추적 패널에서 배열이 어떻게 읽히는지 확인해 보세요.');
      }
    } else {
      inputs.forEach(i => i.classList.add(norm(i.value) === norm(cur.answers[i.dataset.n]) ? 'ok' : 'ng'));
      showResult('fail', '출력이 달라요', '코드는 실행됐지만 결과가 기대와 다릅니다. 빨간 빈칸을 다시 살펴보고, 추적을 돌려 어디서 갈라지는지 찾아보세요.',
        `<div class="cmp"><div><small>내 출력</small><pre>${esc(it.out) || '(없음)'}</pre></div><div><small>기대 출력</small><pre>${esc(exp ?? '')}</pre></div></div>`);
    }
  }
  renderStep(0);
  if (snaps.length > 1) startPlay();
}
function showResult(kind, title, msg, extra = ''){
  const r = $('result'); r.className = 'result show ' + kind;
  r.innerHTML = `<div class="ic">${kind === 'pass' ? '✓' : kind === 'fail' ? '!' : '?'}</div><div style="flex:1;min-width:0"><h3>${title}</h3><p>${msg}</p>${extra}</div>`;
}

/* ===== 힌트 / 정답 / 초기화 ===== */
$('btnHint').addEventListener('click', () => {
  const h = $('hints');
  if (h.classList.contains('show')) { h.className = 'hints'; return; }
  h.innerHTML = `<strong>힌트</strong><ol>${Object.keys(cur.hints).map(n => `<li><b>빈칸 ${n}</b> — ${cur.hints[n]}</li>`).join('')}</ol>`; h.className = 'hints show';
});
$('btnAnswer').addEventListener('click', () => {
  document.querySelectorAll('.blank').forEach(i => { i.value = cur.answers[i.dataset.n]; blankVals[i.dataset.n] = i.value; i.classList.remove('ok', 'ng'); fit(i); });
  store.set('blanks:' + cur.id, blankVals);
  showResult('warn', '정답을 채워 넣었어요', '실행 &amp; 추적을 눌러 동작을 확인해 보세요. 해결 기록은 스스로 채워서 맞혔을 때만 남습니다.');
  solvedGuard = true;
});
$('btnReset').addEventListener('click', () => {
  stopPlay(); snaps = []; solvedGuard = false;
  if (cur.id === 'free') { freeCode = FREE.code; $('freeCode').value = freeCode; store.set('free', freeCode); }
  else { blankVals = {}; store.set('blanks:' + cur.id, {}); document.querySelectorAll('.blank').forEach(i => { i.value = ''; i.classList.remove('ok', 'ng'); fit(i); }); }
  $('result').className = 'result'; $('hints').className = 'hints'; resetViz();
});
$('btnRun').addEventListener('click', () => run());

/* ===== 시각화 ===== */
function resetViz(){
  $('vars').innerHTML = '<div class="empty">▶ 실행 &amp; 추적 버튼을 누르면 변수와 배열이 여기에 나타납니다</div>';
  $('output').innerHTML = ''; $('ostate').textContent = ''; $('vstate').textContent = '실행 전';
  $('stepNo').textContent = '0'; $('stepMax').textContent = '0'; $('stepLine').textContent = '—'; $('slider').max = 0; $('slider').value = 0;
  document.querySelectorAll('.ln').forEach(l => l.classList.remove('cur', 'err'));
  updateButtons();
}
function renderStep(i){
  if (!snaps.length) return;
  stepIdx = Math.max(0, Math.min(snaps.length - 1, i));
  const s = snaps[stepIdx], prev = stepIdx > 0 ? snaps[stepIdx - 1] : null;
  $('slider').value = stepIdx; $('stepNo').textContent = stepIdx; $('stepMax').textContent = snaps.length - 1;
  // 코드 줄 하이라이트
  document.querySelectorAll('.ln').forEach(l => l.classList.remove('cur', 'err'));
  const srcLines = cur.id === 'free' ? null : cur.code.split('\n');
  if (s.line) {
    const el = document.querySelector(`.ln[data-line="${s.line}"]`);
    if (el) { el.classList.add(s.done && s.error ? 'err' : 'cur'); el.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
    const txt = srcLines ? srcLines[s.line - 1].replace(/__(\d+)__/g, (_, n) => blankVals[n] || '?').trim() : ($('freeCode') ? $('freeCode').value.split('\n')[s.line - 1] || '' : '').trim();
    $('stepLine').textContent = `${s.line}행  ${txt}`;
  } else $('stepLine').textContent = '';
  $('vstate').textContent = s.done ? (s.error ? '오류로 중단' : '실행 종료') : stepIdx === 0 ? '시작' : `${s.line}번째 줄 실행 후`;
  renderVars(s, prev);
  // 출력
  const outText = curOut.slice(0, s.outLen);
  let html = esc(outText);
  if (s.done && s.error) html += `<span class="er">${esc(s.error.msg)}</span>`;
  else if (!s.done) html += '<span class="cursor"></span>';
  $('output').innerHTML = html; $('output').scrollTop = $('output').scrollHeight;
  $('ostate').textContent = outText ? `${outText.split('\n').filter((l, i, a) => i < a.length - 1 || l).length}줄` : '';
  updateButtons();
}
function updateButtons(){
  const n = snaps.length; $('bFirst').disabled = $('bPrev').disabled = !n || stepIdx === 0; $('bNext').disabled = $('bLast').disabled = !n || stepIdx >= n - 1; $('bPlay').disabled = n < 2;
  $('bPlay').textContent = timer ? '❚❚' : '▶';
}
function accMap(acc){ const m = {}; for (const a of acc) { (m[a.name] ||= []).push(a); } return m; }
function renderVars(s, prev){
  const box = $('vars'); box.innerHTML = '';
  const am = accMap(s.acc || []);
  const prevMap = {};
  if (prev) prev.frames.forEach((f, fi) => f.vars.forEach(([k, v]) => prevMap[fi + ':' + k] = pyrepr(v)));
  let any = false;
  s.frames.forEach((f, fi) => {
    if (f.name) { const t = document.createElement('div'); t.className = 'frame-title'; t.textContent = `함수 ${f.name}() 안`; box.appendChild(t); }
    const scal = document.createElement('div'); scal.className = 'scalars';
    const lists = [];
    f.vars.forEach(([k, v]) => {
      if (k.startsWith('__')) return; any = true;
      const changed = prev ? prevMap[fi + ':' + k] !== pyrepr(v) : false;
      if (Array.isArray(v) && v.length && v.every(Array.isArray)) lists.push(render2D(k, v, am[k] || [], changed, prev, fi));
      else if (Array.isArray(v)) lists.push(render1D(k, v, am[k] || [], changed, prev, fi));
      else { const c = document.createElement('div'); c.className = 'chip' + (changed ? ' chg' : ''); c.innerHTML = `<span class="k">${esc(k)}</span><span class="v">${esc(pyrepr(v))}</span>`; scal.appendChild(c); }
    });
    if (scal.children.length) box.appendChild(scal);
    lists.forEach(l => box.appendChild(l));
  });
  if (!any) box.innerHTML = '<div class="empty">아직 변수가 없습니다</div>';
}
function prevVal(prev, fi, k){ if (!prev || !prev.frames[fi]) return undefined; const e = prev.frames[fi].vars.find(x => x[0] === k); return e ? e[1] : undefined; }
function render1D(k, v, acc, changed, prev, fi){
  const w = document.createElement('div'); w.className = 'arr';
  const pv = prevVal(prev, fi, k);
  const cells = v.map((x, i) => {
    const a = acc.filter(e => e.path.length === 1 && e.path[0] === i);
    const cls = a.some(e => e.w) ? 'wr' : a.length ? 'rd' : '';
    const chg = Array.isArray(pv) && (i >= pv.length || pyrepr(pv[i]) !== pyrepr(x)) ? ' chg' : '';
    return `<div class="cell ${cls}${chg}"><span class="ix">${i}</span><span class="bx">${esc(pyrepr(x))}</span></div>`;
  }).join('');
  w.innerHTML = `<div class="name"><span>${esc(k)}</span><em>len ${v.length}</em></div><div class="cells">${cells || '<span class="cell"><span class="bx" style="color:var(--muted)">[ ]</span></span>'}</div>`;
  return w;
}
function render2D(k, v, acc, changed, prev, fi){
  const w = document.createElement('div'); w.className = 'arr';
  const pv = prevVal(prev, fi, k);
  const cols = Math.max(...v.map(r => r.length));
  let g = `<div class="grid2" style="grid-template-columns:auto repeat(${cols},auto)"><span></span>${Array.from({ length: cols }, (_, j) => `<span class="hd">${j}</span>`).join('')}`;
  v.forEach((row, i) => {
    g += `<span class="rh">${i}</span>`;
    const rowAcc = acc.some(e => e.path.length === 1 && e.path[0] === i);
    for (let j = 0; j < cols; j++) {
      if (j >= row.length) { g += '<span></span>'; continue; }
      const a = acc.filter(e => e.path.length === 2 && e.path[0] === i && e.path[1] === j);
      const cls = a.some(e => e.w) ? 'wr' : a.length ? 'rd' : rowAcc ? 'row' : '';
      const chg = Array.isArray(pv) && (!pv[i] || j >= pv[i].length || pyrepr(pv[i][j]) !== pyrepr(row[j])) ? ' chg' : '';
      g += `<span class="bx ${cls}${chg}">${esc(pyrepr(row[j]))}</span>`;
    }
  });
  g += '</div>';
  w.innerHTML = `<div class="name"><span>${esc(k)}</span><em>${v.length} × ${cols}</em></div><div style="overflow-x:auto">${g}</div>`;
  return w;
}

/* ===== 재생 컨트롤 ===== */
function delay(){ const v = +$('speed').value; return Math.round(1400 / Math.pow(1.35, v - 1)); }
function startPlay(){ if (timer || snaps.length < 2) return; timer = setInterval(() => { if (stepIdx >= snaps.length - 1) { stopPlay(); return; } renderStep(stepIdx + 1); }, delay()); updateButtons(); }
function stopPlay(){ if (timer) { clearInterval(timer); timer = null; } updateButtons(); }
$('bPlay').addEventListener('click', () => { if (timer) stopPlay(); else { if (stepIdx >= snaps.length - 1) renderStep(0); startPlay(); } });
$('bFirst').addEventListener('click', () => { stopPlay(); renderStep(0); });
$('bLast').addEventListener('click', () => { stopPlay(); renderStep(snaps.length - 1); });
$('bPrev').addEventListener('click', () => { stopPlay(); renderStep(stepIdx - 1); });
$('bNext').addEventListener('click', () => { stopPlay(); renderStep(stepIdx + 1); });
$('slider').addEventListener('input', e => { stopPlay(); renderStep(+e.target.value); });
$('speed').addEventListener('input', () => { if (timer) { stopPlay(); startPlay(); } });
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea') return;
  if (!snaps.length) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); stopPlay(); renderStep(stepIdx + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); stopPlay(); renderStep(stepIdx - 1); }
  else if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); }
});
